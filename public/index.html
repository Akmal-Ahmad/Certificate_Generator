<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Certificate Generator</title>

  <link href="https://fonts.googleapis.com/css2?family=Droid+Serif&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #2e2e3a;
      --accent-color: #7e57c2;
      --hover-color: #ff8a65;
      --background-gradient: linear-gradient(135deg, #f1e4ff, #fffdf5);
      --input-background: #ffffff;
      --border-color: #ccc;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: var(--primary-color);
      background-image: linear-gradient(135deg, rgba(241, 228, 255, 0.85), rgba(255, 253, 245, 0.85)), url('images/checkered-pattern.png');
      background-repeat: repeat, repeat;
      background-size: auto, auto;
      background-position: top left, top left;
      background-blend-mode: overlay;
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 60px 20px 20px;
    }

    header h1 {
      font-size: 64px;
      margin: 0;
      font-family: 'Droid Serif', serif;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(to right, #7e57c2, #ff8a65);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      padding: 30px;
      background-color: var(--input-background);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
    }

    form {
      padding: 0;
    }

    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--input-background);
      box-sizing: border-box;
      color: var(--primary-color);
    }

    input:focus {
      outline: none;
      border-color: var(--accent-color);
      box-shadow: 0 0 8px rgba(126, 87, 194, 0.4);
    }

    button {
      background: #BD7094;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background: linear-gradient(to right, #7e57c2, #ff8a65);
      color: white;
      transform: scale(1.02);
    }

    #actionButtons {
      display: none; 
      margin-top: 20px;
      gap: 10px;
      display: flex;
    }

    footer {
      font-size: 12px;
      color: #444;
      text-align: center;
      padding: 20px 10px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Certificate<br>Generator</h1>
  </header>

  <main>
    <div class="container">
      <form id="certificateForm">
        <input type="text" name="name" placeholder="Student Name" required />
        <input type="text" name="course" placeholder="Course Name" required />
        <input type="date" name="date" required />
        <button type="submit">Generate Certificate</button>
      </form>

      <div id="actionButtons" style="display: none;">
        <button id="viewBtn" type="button">View</button>
        <button id="downloadBtn" type="button">Download</button>
      </div>
    </div>
  </main>

  <footer>
    &copy; All Rights Reserved <strong>|</strong> <span>Designed By Akmal Ahmad</span>
  </footer>

  <script>
    const form = document.getElementById('certificateForm');
    const viewBtn = document.getElementById('viewBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const actionButtons = document.getElementById('actionButtons');

    let pdfBlobUrl = null;

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const formData = new FormData(form);
      try {
        const response = await fetch('/generate', {
          method: 'POST',
          body: new URLSearchParams(formData),
        });
        if (!response.ok) {
          throw new Error("PDF generation failed");
        }
        const blob = await response.blob();
        pdfBlobUrl = URL.createObjectURL(blob);
        actionButtons.style.display = 'flex';
      } catch (err) {
        alert("Error generating certificate: " + err.message);
      }
    });

    viewBtn.addEventListener('click', () => {
      if (pdfBlobUrl) {
        window.open(pdfBlobUrl, '_blank');
      }
    });

    downloadBtn.addEventListener('click', () => {
      if (pdfBlobUrl) {
        const studentName = document.querySelector('input[name="name"]').value.trim();
        const filename = `${studentName} Certificate.pdf`;
        const a = document.createElement('a');
        a.href = pdfBlobUrl;
        a.download = filename;
        a.click();
      }
    });
  </script>
</body>
</html>
